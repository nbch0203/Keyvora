[package]
name = "keyvora-ffi"
description = "UniFFI (Kotlin) bindings of the Keyvora core for Android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "keyvora_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
keyvora-crypto.workspace = true
keyvora-vault.workspace = true
keyvora-sync.workspace = true
keyvora-passgen.workspace = true
thiserror.workspace = true
uniffi = "=0.28.3"
