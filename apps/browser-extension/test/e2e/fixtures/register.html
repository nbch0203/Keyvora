<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><title>Registro de prueba</title></head>
  <body>
    <h1>Crear cuenta</h1>
    <form id="register" action="#" onsubmit="return false">
      <label>Correo <input type="email" id="email" name="email" /></label>
      <label>Contraseña <input type="password" id="new-password" name="password" autocomplete="new-password" /></label>
      <label>Repite la contraseña <input type="password" id="confirm-password" name="confirm" autocomplete="new-password" /></label>
      <button type="submit">Registrarse</button>
    </form>
  </body>
</html>
