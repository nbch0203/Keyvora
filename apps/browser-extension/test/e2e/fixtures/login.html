<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><title>Login de prueba</title></head>
  <body>
    <h1>Iniciar sesión</h1>
    <form id="login" action="#" onsubmit="return false">
      <label>Buscar <input type="search" id="search" /></label>
      <label>Usuario <input type="text" id="username" name="username" autocomplete="username" /></label>
      <input type="text" id="honeypot" name="website" style="display:none" />
      <label>Contraseña <input type="password" id="password" name="password" autocomplete="current-password" /></label>
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
