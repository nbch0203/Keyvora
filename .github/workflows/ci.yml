name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supply chain: every action is pinned to a full commit SHA (the comment names the release it was taken from),
# every tool installed here has an exact version, and Cargo.lock is versioned and enforced with --locked.
# dtolnay/rust-toolchain publishes no version tags: the SHA is the head of its `stable` branch on the date given.

jobs:
  core:
    name: Rust core (fmt, clippy, tests, vectors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo.lock is committed and up to date (--locked)
        # Fails if Cargo.lock is missing or would have to change; the cargo build/clippy/test calls in
        # scripts/wsl/*.sh then resolve exactly the committed lockfile.
        run: cargo fetch --locked
      - name: fmt / clippy / test
        env:
          CARGO_TARGET_DIR: target
        run: bash scripts/wsl/test-core.sh
      - name: Independent vector verification (argon2-cffi + OpenSSL)
        run: |
          python3 -m venv .venv && .venv/bin/pip install -q argon2-cffi==25.1.0 cryptography==50.0.2
          .venv/bin/python tests/security/verify_vectors.py
      - name: Dependency audit
        run: cargo install cargo-audit --locked --version 0.23.0 && cargo audit

  extension:
    name: Browser extension (WASM + unit + E2E)
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo.lock is committed and up to date (--locked)
        run: cargo fetch --locked
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)"
      - run: CARGO_TARGET_DIR=target bash scripts/wsl/build-wasm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/browser-extension/package-lock.json
      - working-directory: apps/browser-extension
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm audit --omit=dev

  android:
    name: Android (UniFFI core + Gradle)
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo.lock is committed and up to date (--locked)
        run: cargo fetch --locked
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default ("tools platform-tools") fails: the runner's cmdline-tools no longer provide "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "ndk;27.3.13750724"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724 CARGO_TARGET_DIR=target bash scripts/wsl/build-android-core.sh
      - working-directory: apps/android
        # The wrapper verifies the downloaded Gradle distribution against distributionSha256Sum.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pkeyvora.requireHostCore=true :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
